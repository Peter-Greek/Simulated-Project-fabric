name: Fabric 1.20.1 build

on:
  push:
    branches:
      - fabric-homestead-1.20.1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Simulated Fabric skeleton
        run: ./gradlew :simulated:fabric:build --stacktrace
