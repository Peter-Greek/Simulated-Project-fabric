name: Fabric 1.20.1 build

on:
  push:
    branches:
      - fabric-homestead-1.20.1
    paths-ignore:
      - 'sable-backport/**'
      - '.github/workflows/sable-1.20.1.yml'

concurrency:
  group: fabric-homestead-1.20.1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Simulated Fabric test jar
        run: ./gradlew :simulated:fabric:build --stacktrace
      - name: Upload test jar
        uses: actions/upload-artifact@v4
        with:
          name: simulated-fabric-homestead-test
          path: simulated/fabric/build/libs/simulated-fabric-*.jar
          if-no-files-found: error
