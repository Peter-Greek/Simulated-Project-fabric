plugins {
    id 'fabric-loom'
}

base {
    archivesName = 'simulated-fabric'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://mvn.devos.one/releases' }
    maven { url = 'https://maven.createmod.net' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Exact Create Fabric build shipped by Homestead 1.3.7.
    // Use the upstream Create/Fabric Maven instead of Modrinth's Maven proxy.
    modImplementation "com.simibubi.create:create-fabric:${create_fabric_version}"
}

loom {
    runs {
        client {
            client()
            name = 'Homestead Fabric Client'
        }
        server {
            server()
            name = 'Homestead Fabric Server'
        }
    }
}

sourceSets {
    main {
        // Gradle already includes src/main/resources by default. Only add the
        // upstream common resource tree here so fabric.mod.json is copied once.
        resources {
            srcDir '../common/src/main/resources'
            exclude 'META-INF/**'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(java_version)
}
